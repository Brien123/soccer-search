[project]
name = "stats"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Zeh237", email = "zehbrien@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "elasticsearch>=8.0.0",
    "fastapi[standard]>=0.115.0",
    "jinja2>=3.1.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
stats = "stats:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "B008",
]

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
